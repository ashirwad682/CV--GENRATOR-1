<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive CV Builder - Login & Register</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="auth-page">
        <div class="glass-panel auth-card">
            
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-file-invoice"></i> CV Builder
                </div>
                <p class="auth-subtitle">Secure Multi-Resume Cloud Management System</p>
            </div>

            <!-- Auth Form Selector Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
                <button type="button" class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </div>

            <!-- Alert Feedback -->
            <div id="auth-alert" class="alert-message alert-error"></div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="name@company.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In to Dashboard
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="Ashirwad Kumar" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="name@company.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary" id="reg-btn">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </form>

        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
